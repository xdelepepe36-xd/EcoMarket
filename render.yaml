services:
  - type: web
    name: ecomarket
    runtime: docker
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        value: /app/data/ecomarket.db
      - key: UPLOADS_DIR
        value: /app/static/uploads
      - key: PORT
        value: 8000
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ecomarket-data
      mountPath: /app/data
      sizeGB: 1