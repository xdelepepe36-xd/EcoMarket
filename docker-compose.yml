# ─────────────────────────────────────────────────────────────
#  docker-compose.yml — EcoMarket local con Docker
#  Uso: docker compose up
# ─────────────────────────────────────────────────────────────
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-only-change-me}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - DATABASE_URL=/data/ecomarket.db
      - UPLOADS_DIR=/app/static/uploads
      - WORKERS=2
    volumes:
      - ./data:/data               # BD persistente
      - ./static/uploads:/app/static/uploads  # imágenes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3