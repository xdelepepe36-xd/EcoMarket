{% extends 'base.html' %}
{% block title %}EcoMarket - Mensajes{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width:960px;">
        <h1 class="section-title" style="margin-bottom:6px;">💬 <span data-i18n="msg.title">Mensajes</span></h1>
        <p style="color:var(--texto-sec,#666);margin-bottom:24px;" data-i18n="msg.subtitle">Conversaciones privadas con compradores y vendedores.</p>

        <div id="msgLayout" style="display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;">
            <!-- Lista de hilos -->
            <div id="msgHilos" style="background:var(--blanco,#fff);border-radius:18px;box-shadow:var(--sombra);overflow:hidden;border:1px solid rgba(46,125,50,.08);"></div>

            <!-- Conversación activa -->
            <div id="msgConversacion" style="background:var(--blanco,#fff);border-radius:18px;box-shadow:var(--sombra);border:1px solid rgba(46,125,50,.08);display:flex;flex-direction:column;min-height:420px;">
                <div id="msgConvHeader" style="padding:18px 20px;border-bottom:1px solid rgba(46,125,50,.1);display:none;">
                    <strong id="msgConvNombre"></strong>
                    <div id="msgConvProducto" style="font-size:.82rem;color:var(--texto-sec,#666);"></div>
                </div>
                <div id="msgLista" style="flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:380px;"></div>
                <div id="msgVacio" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--texto-sec,#888);padding:40px;text-align:center;">
                    <div><i class="bi bi-chat-square-text" style="font-size:2.4rem;display:block;margin-bottom:10px;opacity:.4;"></i>
                    <span data-i18n="msg.empty">Selecciona una conversación para ver los mensajes</span></div>
                </div>
                <form id="msgForm" style="display:none;padding:14px;border-top:1px solid rgba(46,125,50,.1);gap:10px;">
                    <div style="display:flex;gap:10px;">
                        <input type="text" id="msgInput" maxlength="1000" style="flex:1;border:2px solid rgba(46,125,50,.2);border-radius:12px;padding:11px 14px;font-family:inherit;" data-i18n-placeholder="msg.placeholder" placeholder="Escribe un mensaje...">
                        <button type="submit" class="btn-principal" style="padding:11px 18px;"><i class="bi bi-send"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
<script>
const HILOS = {{ hilos|tojson }};
let hiloActivo = null;

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function renderHilos(){
    const el=document.getElementById('msgHilos');
    if(!HILOS.length){
        el.innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--texto-sec,#888);">'
            +'<i class="bi bi-inbox" style="font-size:2.4rem;display:block;margin-bottom:10px;opacity:.4;"></i>'
            +'<span data-i18n="msg.no_chats">No tienes conversaciones todavía</span></div>';
        return;
    }
    el.innerHTML=HILOS.map((h,i)=>`
        <button onclick="abrirHilo(${i})" style="width:100%;text-align:left;background:${hiloActivo===i?'rgba(46,125,50,.1)':'transparent'};border:none;border-bottom:1px solid rgba(46,125,50,.08);padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;">
            <div style="width:42px;height:42px;border-radius:50%;background:${h.otro_color||'#2e7d32'};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;">${esc(h.otro_nombre[0]||'?')}</div>
            <div style="flex:1;min-width:0;">
                <div style="font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;">
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(h.otro_nombre)}</span>
                    ${h.no_leidos?`<span style="background:#e53935;color:#fff;border-radius:999px;font-size:.68rem;padding:1px 7px;flex-shrink:0;">${h.no_leidos}</span>`:''}
                </div>
                <div style="font-size:.78rem;color:var(--texto-sec,#888);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    ${h.producto_nombre?'📦 '+esc(h.producto_nombre):'<span data-i18n="msg.general">Conversación general</span>'}
                </div>
            </div>
        </button>`).join('');
}

async function abrirHilo(i){
    hiloActivo=i;
    const h=HILOS[i];
    document.getElementById('msgConvHeader').style.display='block';
    document.getElementById('msgConvNombre').textContent=h.otro_nombre;
    document.getElementById('msgConvProducto').textContent=h.producto_nombre||'';
    document.getElementById('msgVacio').style.display='none';
    document.getElementById('msgForm').style.display='flex';
    document.getElementById('msgForm').dataset.con=h.otro_id;
    document.getElementById('msgForm').dataset.prod=h.producto_id||'';
    renderHilos();
    cargarMensajes(h.otro_id, h.producto_id);
}

async function cargarMensajes(conId, prodId){
    const params=new URLSearchParams({con:conId});
    if(prodId) params.set('producto',prodId);
    const r=await fetch('/api/mensajes/hilo?'+params);
    const d=await r.json();
    const lista=document.getElementById('msgLista');
    const mioId={{ session.get('usuario_id') or 0 }};
    const nearBottom = lista.scrollHeight - lista.scrollTop - lista.clientHeight < 80;
    lista.innerHTML=d.mensajes.map(m=>{
        const mio=m.de_id==mioId;
        return `<div style="max-width:78%;align-self:${mio?'flex-end':'flex-start'};">
            <div style="background:${mio?'linear-gradient(135deg,#2e7d32,#43a047)':'#f1f4ef'};color:${mio?'#fff':'inherit'};border-radius:16px;padding:10px 14px;font-size:.9rem;line-height:1.5;${mio?'border-bottom-right-radius:4px':'border-bottom-left-radius:4px'}">
                ${esc(m.mensaje).replace(/\n/g,'<br>')}
            </div>
            <div style="font-size:.68rem;color:var(--texto-sec,#999);margin-top:3px;${mio?'text-align:right':''}">${esc(m.de_nombre)} · ${m.created_at.slice(5,16)}</div>
        </div>`;
    }).join('')||'<div style="color:var(--texto-sec,#888);font-size:.85rem;text-align:center;padding:20px;">Sin mensajes aún — ¡saluda! 👋</div>';
    if(nearBottom) lista.scrollTop=lista.scrollHeight;
}

// tiempo real: recarga el hilo cada 4s mientras esté abierto
setInterval(()=>{
    if(hiloActivo===null) return;
    const f=document.getElementById('msgForm');
    if(!f||!f.dataset.con) return;
    cargarMensajes(+f.dataset.con, f.dataset.prod?+f.dataset.prod:null);
},4000);

document.getElementById('msgForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const inp=document.getElementById('msgInput');
    const texto=inp.value.trim();
    if(!texto)return;
    const f=e.target;
    const r=await fetch('/api/mensajes',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({para_id:+f.dataset.con,producto_id:f.dataset.prod||null,mensaje:texto})});
    const d=await r.json();
    if(d.success){inp.value='';abrirHilo(hiloActivo);}
    else alert(d.error||'Error');
});

renderHilos();
</script>
<style>@media(max-width:768px){ #msgLayout{grid-template-columns:1fr!important} }</style>
{% endblock %}
