{% extends 'base.html' %}
{% block title %}EcoMarket - Iniciar Sesión{% endblock %}

{% block content %}
<section class="section">
    <div class="container auth-container">
        {% include "auth_brand.html" %}
        <div class="auth-card form-card"><span class="auth-blob auth-blob-1"></span><span class="auth-blob auth-blob-2"></span>
            <div class="auth-header">
                <img src="{{ url_for('static', filename='assets/mascota-sticker.svg') }}" class="auth-mascot" alt="Eco">
                <h2 class="section-title" data-i18n="auth.login_title">Iniciar Sesión</h2>
                <p data-i18n="auth.login_desc">Accede a tu cuenta para comprar y vender productos ecológicos.</p>
            </div>
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="email"><i class="bi bi-envelope"></i> <span data-i18n="auth.email">Correo electrónico</span></label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" data-i18n-placeholder="auth.email_placeholder" required autofocus>
                <label for="password"><i class="bi bi-lock"></i> <span data-i18n="auth.password">Contraseña</span></label>
                <div class="pw-wrap">
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" data-i18n-placeholder="auth.password_placeholder" required>
                    <button type="button" class="pw-toggle" data-target="password" tabindex="-1" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                </div>
                <button class="btn-principal" type="submit" style="width:100%; margin-top:8px;">
                    <i class="bi bi-box-arrow-in-right"></i> <span data-i18n="auth.login_button">Ingresar</span>
                </button>
            </form>
            <div style="text-align:center; margin: 4px 0 10px;">
                <a href="{{ url_for('recuperar_password') }}" style="font-size:.88rem; color:#2e7d32; font-weight:600; text-decoration:none;">
                    <i class="bi bi-key"></i> <span data-i18n="auth.forgot">¿Olvidaste tu contraseña?</span>
                </a>
            </div>
            <div class="auth-divider"><span data-i18n="auth.or">o</span></div>
            <div class="google-login-wrap" data-eco-google-btn></div>
            <div class="auth-divider"><span data-i18n="auth.no_account">¿No tienes cuenta?</span></div>
            <a href="{{ url_for('registro') }}" class="btn-secundario" style="width:100%; text-align:center;">
                <i class="bi bi-person-plus"></i> <span data-i18n="auth.register_button">Crear cuenta</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
