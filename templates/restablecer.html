{% extends 'base.html' %}
{% block title %}EcoMarket - Nueva contraseña{% endblock %}

{% block content %}
<section class="section">
    <div class="container auth-container">
        {% include "auth_brand.html" %}
        <div class="auth-card form-card"><span class="auth-blob auth-blob-1"></span><span class="auth-blob auth-blob-2"></span>
            <div class="auth-header">
                <img src="{{ url_for('static', filename='assets/mascota-sticker.svg') }}" class="auth-mascot" alt="Eco">
                <h2 class="section-title" data-i18n="auth.reset_title">Nueva contraseña</h2>
                <p data-i18n="auth.reset_desc">Elige una contraseña segura para tu cuenta.</p>
            </div>
            <form method="POST" action="{{ url_for('restablecer_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="token" value="{{ token }}">
                <label for="password"><i class="bi bi-lock"></i> <span data-i18n="auth.new_password">Nueva contraseña</span></label>
                <div class="pw-wrap">
                    <input type="password" id="password" name="password" minlength="8" placeholder="Mínimo 8 caracteres" required autofocus>
                    <button type="button" class="pw-toggle" data-target="password" tabindex="-1" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                </div>
                <label for="password2"><i class="bi bi-lock-fill"></i> <span data-i18n="auth.confirm_password">Confirmar contraseña</span></label>
                <div class="pw-wrap">
                    <input type="password" id="password2" name="password2" minlength="8" placeholder="Repite la contraseña" required>
                    <button type="button" class="pw-toggle" data-target="password2" tabindex="-1" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                </div>
                <button class="btn-principal" type="submit" style="width:100%; margin-top:8px;">
                    <i class="bi bi-check-lg"></i> <span data-i18n="auth.reset_button">Guardar contraseña</span>
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
