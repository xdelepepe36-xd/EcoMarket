{% extends 'base.html' %}
{% block title %}EcoMarket - Crear Cuenta{% endblock %}

{% block content %}
<section class="section">
    <div class="container auth-container">
        <div class="auth-card form-card">
            <div class="auth-header">
                <span class="auth-icon">🌿</span>
                <h2 class="section-title">Crear Cuenta</h2>
                <p>Únete a la comunidad ecológica más grande del Perú.</p>
            </div>
            <form method="POST" action="{{ url_for('registro') }}">
                <label for="nombre"><i class="bi bi-person"></i> Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required autofocus>
                <label for="email"><i class="bi bi-envelope"></i> Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                <label for="password"><i class="bi bi-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                <label for="password2"><i class="bi bi-lock-fill"></i> Confirmar contraseña</label>
                <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña" required>
                <button class="btn-principal" type="submit" style="width:100%; margin-top:8px;">
                    <i class="bi bi-person-check"></i> Crear cuenta
                </button>
            </form>
            <div class="auth-divider"><span>¿Ya tienes cuenta?</span></div>
            <a href="{{ url_for('login') }}" class="btn-secundario" style="width:100%; text-align:center;">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
            </a>
        </div>
    </div>
</section>
{% endblock %}
