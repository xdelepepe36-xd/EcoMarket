<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoMarket — Mantenimiento</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#e8f5e9,#f1f8e9);color:#1a2e1a}
  .card{background:#fff;border-radius:24px;padding:48px 40px;max-width:480px;text-align:center;box-shadow:0 20px 60px rgba(46,125,50,.15)}
  .leaf{font-size:4rem;display:block;margin-bottom:16px}
  h1{font-size:1.6rem;color:#2e7d32;margin-bottom:12px}
  p{color:#555;line-height:1.6;margin-bottom:8px}
  .btn{display:inline-block;margin-top:16px;padding:12px 28px;background:#2e7d32;color:#fff;border-radius:999px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <span class="leaf">🌱</span>
  <h1>Estamos en mantenimiento</h1>
  <p>EcoMarket está mejorando para ti. Volvemos en unos minutos.</p>
  <p style="font-size:.85rem;color:#888">Disculpa las molestias — estamos cultivando algo mejor.</p>
  <a class="btn" href="/">Reintentar</a>
</div>
</body>
</html>
