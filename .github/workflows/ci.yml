name: CI EcoMarket

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis y arranque
        run: |
          python -m py_compile app.py
          python -c "import app; print('app importa OK, rutas:', len(list(app.app.url_map.iter_rules())))"

      - name: Ejecutar pruebas del backend
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/test_backend.py

      - name: Smoke test de rutas principales
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "from app import app; c=app.test_client(); [print(p, c.get(p).status_code) for p in ['/','/productos','/login','/registro','/checkout','/impacto']]"