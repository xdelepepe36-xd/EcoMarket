<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" role="img" aria-label="Eco, el mapache mascota de EcoMarket">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C4D0"/>
      <stop offset="1" stop-color="#8D99AB"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- ===== COLA (detrás, derecha) ===== -->
  <path d="M168 226 C 205 218 214 168 196 128" fill="none" stroke="#8D99AB" stroke-width="22" stroke-linecap="round"/>
  <path d="M168 226 C 205 218 214 168 196 128" fill="none" stroke="#374151" stroke-width="22" stroke-linecap="round" stroke-dasharray="12 16"/>

  <!-- ===== PIEZAS DEL POLO (torso) ===== -->
  <!-- torso -->
  <path d="M110 128 C 66 128 52 162 52 198 C 52 230 72 244 110 244 C 148 244 168 230 168 198 C 168 162 154 128 110 128 Z" fill="url(#shirt)" stroke="#047857" stroke-width="3"/>
  <!-- cuello polo -->
  <path d="M92 128 L 110 148 L 128 128 L 121 120 L 110 128 L 99 120 Z" fill="#065F46"/>
  <!-- botones -->
  <circle cx="110" cy="160" r="3.5" fill="#FFFFFF" opacity=".9"/>
  <circle cx="110" cy="176" r="3.5" fill="#FFFFFF" opacity=".9"/>
  <circle cx="110" cy="192" r="3.5" fill="#FFFFFF" opacity=".9"/>
  <!-- logo: hoja -->
  <g transform="translate(110 148)">
    <circle r="14" fill="#FFFFFF"/>
    <path d="M0 -8 C -7 -3 -8 5 -3 9 C 1 6 2 -1 0 -8 Z" fill="#059669"/>
    <path d="M0 -8 C 4 -3 5 4 1 8" fill="none" stroke="#065F46" stroke-width="1.8"/>
  </g>
  <!-- nombre en el pecho -->
  <text x="110" y="222" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">EcoMarket</text>

  <!-- mangas cortas -->
  <path d="M58 142 C 48 148 47 162 56 168 L 68 161 C 61 155 61 146 68 142 Z" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <path d="M162 142 C 172 148 173 162 164 168 L 152 161 C 159 155 159 146 152 142 Z" fill="#059669" stroke="#047857" stroke-width="2.5"/>

  <!-- ===== BRAZOS ===== -->
  <!-- izquierdo colgando -->
  <path d="M60 160 C 46 172 45 194 56 206" fill="none" stroke="#8D99AB" stroke-width="16" stroke-linecap="round"/>
  <circle cx="57" cy="210" r="11" fill="#374151"/>
  <!-- derecho saludando -->
  <path d="M160 158 C 176 142 184 120 176 98" fill="none" stroke="#8D99AB" stroke-width="16" stroke-linecap="round"/>
  <circle cx="174" cy="92" r="12" fill="#374151"/>
  <path d="M166 82 l-5 -9 M175 79 l0 -10 M184 82 l5 -9" stroke="#374151" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ===== PIERNAS ===== -->
  <rect x="84" y="238" width="18" height="10" rx="5" fill="#4B5563"/>
  <ellipse cx="90" cy="246" rx="17" ry="7" fill="#1F2937"/>
  <rect x="118" y="238" width="18" height="10" rx="5" fill="#4B5563"/>
  <ellipse cx="130" cy="246" rx="17" ry="7" fill="#1F2937"/>

  <!-- ===== CABEZA ===== -->
  <circle cx="110" cy="72" r="46" fill="url(#fur)" stroke="#6B7789" stroke-width="3"/>
  <!-- orejas -->
  <circle cx="68" cy="38" r="18" fill="url(#fur)" stroke="#6B7789" stroke-width="3"/>
  <circle cx="152" cy="38" r="18" fill="url(#fur)" stroke="#6B7789" stroke-width="3"/>
  <circle cx="68" cy="38" r="10" fill="#4B5563"/>
  <circle cx="152" cy="38" r="10" fill="#4B5563"/>
  <!-- máscara mapache -->
  <path d="M64 66 Q 110 44 156 66 Q 160 82 150 92 Q 110 106 70 92 Q 60 82 64 66 Z" fill="#1F2937"/>
  <!-- cejas -->
  <path d="M80 58 Q 90 52 99 57 M121 57 Q 130 52 140 58" stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- ojos grandes -->
  <circle cx="91" cy="76" r="10" fill="#FFFFFF"/>
  <circle cx="129" cy="76" r="10" fill="#FFFFFF"/>
  <circle cx="92" cy="77" r="5.5" fill="#111827"/>
  <circle cx="128" cy="77" r="5.5" fill="#111827"/>
  <circle cx="94" cy="74" r="2" fill="#FFFFFF"/>
  <circle cx="130" cy="74" r="2" fill="#FFFFFF"/>
  <!-- hocico -->
  <ellipse cx="110" cy="99" rx="23" ry="15" fill="#E9EEF4"/>
  <!-- nariz -->
  <path d="M101 90 Q 110 85 119 90 Q 117 98 110 99 Q 103 98 101 90 Z" fill="#1F2937"/>
  <!-- sonrisa -->
  <path d="M97 103 Q 110 114 123 103" stroke="#1F2937" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- cachetes -->
  <circle cx="72" cy="94" r="7" fill="#F59E0B" opacity=".4"/>
  <circle cx="148" cy="94" r="7" fill="#F59E0B" opacity=".4"/>
  <!-- bigotes -->
  <path d="M60 92 l-16 -4 M60 99 l-16 1 M160 92 l16 -4 M160 99 l16 1" stroke="#4B5563" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
</svg>
