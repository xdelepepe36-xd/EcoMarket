<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Página no encontrada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="eco-styles.css">
    <style>
        :root {
            --verde: #2e7d32; --verde-claro: #4caf50; --verde-suave: #e8f5e9;
            --texto: #1f2a21; --texto-sec: #5d6a5f; --blanco: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f4fbf5 0%, #eef7ee 50%, #fbfefc 100%);
            padding: 40px 20px;
            text-align: center;
        }
        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 800;
            color: var(--verde-suave);
            line-height: 1;
            letter-spacing: -0.05em;
            position: relative;
        }
        .error-emoji {
            font-size: clamp(4rem, 10vw, 8rem);
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
        .error-code span {
            color: var(--verde);
            position: relative;
            z-index: 1;
        }
        .leaves {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .leaf {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.3;
            animation: leafFall 6s linear infinite;
        }
        @keyframes leafFall {
            0% { transform: translateY(-40px) rotate(0deg); opacity: 0.3; }
            100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
        }
        h1 {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            color: var(--texto);
            margin-bottom: 12px;
        }
        p {
            color: var(--texto-sec);
            font-size: 1rem;
            line-height: 1.8;
            max-width: 460px;
            margin: 0 auto 32px;
        }
        .actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--verde-claro), var(--verde));
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 12px 28px rgba(46,125,50,0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 18px 36px rgba(46,125,50,0.35); }
        .btn-secondary {
            background: var(--blanco);
            color: var(--texto);
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1.5px solid rgba(46,125,50,0.2);
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: var(--verde-suave); }
        .search-box {
            margin-top: 36px;
            max-width: 480px;
            width: 100%;
        }
        .search-wrap {
            display: flex;
            gap: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .search-wrap input {
            flex: 1;
            padding: 14px 18px;
            border: 1.5px solid rgba(46,125,50,0.15);
            border-right: none;
            border-radius: 14px 0 0 14px;
            font-family: inherit;
            font-size: 0.93rem;
            outline: none;
            color: var(--texto);
            transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--verde); }
        .search-wrap button {
            padding: 14px 22px;
            border: none;
            background: linear-gradient(135deg, var(--verde-claro), var(--verde));
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.93rem;
            cursor: pointer;
            border-radius: 0 14px 14px 0;
            transition: background 0.2s;
        }
        .search-wrap button:hover { background: #1b5e20; }
        .suggestions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        .suggestion {
            padding: 8px 16px;
            border-radius: 999px;
            background: var(--verde-suave);
            color: var(--verde);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .suggestion:hover { background: var(--verde); color: #fff; transform: translateY(-2px); }
        .footer-text {
            margin-top: 60px;
            color: var(--texto-sec);
            font-size: 0.85rem;
        }
        .footer-text a { color: var(--verde); font-weight: 600; text-decoration: none; }
        @media (max-width: 480px) {
            .search-wrap { flex-direction: column; border-radius: 14px; }
            .search-wrap input { border-radius: 14px 14px 0 0; border-right: 1.5px solid rgba(46,125,50,0.15); }
            .search-wrap button { border-radius: 0 0 14px 14px; }
        }
    </style>
</head>
<body>

    <div class="error-emoji">🌿</div>
    <div class="error-code">
        <span>404</span>
        <div class="leaves">
            <div class="leaf" style="left:10%;animation-delay:0s">🍃</div>
            <div class="leaf" style="left:30%;animation-delay:1.5s">🌱</div>
            <div class="leaf" style="left:55%;animation-delay:3s">🍂</div>
            <div class="leaf" style="left:80%;animation-delay:4.5s">🍀</div>
        </div>
    </div>

    <h1>¡Ups! Página no encontrada</h1>
    <p>Parece que esta página se perdió en el bosque 🌲. La página que buscas fue eliminada, cambió de nombre o no está disponible.</p>

    <div class="actions">
        <a href="index.html" class="btn-primary"><i class="bi bi-house-fill"></i> Volver al inicio</a>
        <a href="productos.html" class="btn-secondary"><i class="bi bi-grid"></i> Ver productos</a>
    </div>

    <div class="search-box">
        <p style="font-size:0.85rem;color:var(--texto-sec);margin-bottom:10px">¿Buscabas algo?</p>
        <div class="search-wrap">
            <input type="text" id="search404" placeholder="Buscar en EcoMarket...">
            <button onclick="doSearch()"><i class="bi bi-search"></i> Buscar</button>
        </div>
        <div class="suggestions">
            <a href="productos.html" class="suggestion">🌿 Jardín</a>
            <a href="productos.html" class="suggestion">💧 Accesorios</a>
            <a href="impacto.html" class="suggestion">🌍 Impacto</a>
            <a href="contacto.html" class="suggestion">📬 Contacto</a>
        </div>
    </div>

    <p class="footer-text">🌱 <a href="index.html">EcoMarket</a> — Marketplace ecológico</p>

    <script src="eco-toast.js"></script>
    <script src="eco-cart.js"></script>
    <script src="eco-favorites.js"></script>
    <script src="eco-search.js"></script>
    <script src="eco-animations.js"></script>
    <script src="eco-notifications.js"></script>
    <script src="eco-theme.js"></script>
    <script src="eco-gamification.js"></script>
    <script>
        function doSearch() {
            const q = document.getElementById('search404').value.trim();
            if (q) {
                window.location.href = `productos.html?q=${encodeURIComponent(q)}`;
            } else {
                EcoToast.warning('Escribe algo para buscar');
            }
        }
        document.getElementById('search404').addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
