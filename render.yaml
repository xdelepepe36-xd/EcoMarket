services:
  - type: web
    name: ecomarket
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        value: /var/data/ecomarket.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ecomarket-data
      mountPath: /var/data
      sizeGB: 1