<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" role="img" aria-label="Eco, la mascota hoja de EcoMarket — versión sticker">
  <defs>
    <linearGradient id="leafMain" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6EE7A0"/>
      <stop offset="0.45" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="leafShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra de sticker -->
  <ellipse cx="110" cy="222" rx="62" ry="11" fill="#14532D" opacity="0.18"/>

  <!-- Borde blanco tipo sticker: silueta de la hoja agrandada detrás de todo -->
  <g transform="translate(110,110) scale(1.09) translate(-100,-104)">
    <path d="M100 18
             C 138 26 166 58 172 104
             C 177 142 152 178 100 190
             C 48 178 23 142 28 104
             C 34 58 62 26 100 18 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- tallo -->
  <path d="M100 178 C 99 192 97 200 92 208" stroke="#166534" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M100 178 C 99 192 97 200 92 208" stroke="#4ADE80" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- hoja -->
  <path d="M100 18
           C 138 26 166 58 172 104
           C 177 142 152 178 100 190
           C 48 178 23 142 28 104
           C 34 58 62 26 100 18 Z"
        fill="url(#leafMain)"/>

  <!-- borde interior más oscuro para dar volumen -->
  <path d="M100 18 C 138 26 166 58 172 104 C 177 142 152 178 100 190 C 48 178 23 142 28 104 C 34 58 62 26 100 18 Z"
        fill="none" stroke="#14532D" stroke-width="3" opacity="0.18" transform="translate(0,4) scale(0.97) translate(3,0)"/>

  <!-- brillo diagonal -->
  <path d="M46 66 C 64 50 88 40 110 40 C 88 50 68 64 52 82 C 46 76 44 71 46 66 Z" fill="url(#leafShine)" opacity="0.7"/>
  <ellipse cx="72" cy="56" rx="10" ry="22" fill="#FFFFFF" opacity="0.28" transform="rotate(-18 72 56)"/>

  <!-- nervadura central gruesa -->
  <path d="M100 40 L 100 178" stroke="#14532D" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M100 40 L 100 178" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="translate(-1.5,0)"/>

  <!-- nervaduras laterales (pluma) -->
  <g stroke="#14532D" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M100 62 C 80 68 62 80 50 98"/>
    <path d="M100 62 C 120 68 138 80 150 98"/>
    <path d="M100 96 C 84 101 70 112 60 128"/>
    <path d="M100 96 C 116 101 130 112 140 128"/>
    <path d="M100 128 C 88 132 78 140 70 152"/>
    <path d="M100 128 C 112 132 122 140 130 152"/>
  </g>
  <g stroke="#4ADE80" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M100 62 C 80 68 62 80 50 98" transform="translate(-1.2,0)"/>
    <path d="M100 62 C 120 68 138 80 150 98" transform="translate(1.2,0)"/>
    <path d="M100 96 C 84 101 70 112 60 128" transform="translate(-1.2,0)"/>
    <path d="M100 96 C 116 101 130 112 140 128" transform="translate(1.2,0)"/>
  </g>

  <!-- ===== CARITA ===== -->
  <!-- cachetes -->
  <circle cx="58" cy="112" r="11" fill="url(#blush)"/>
  <circle cx="142" cy="112" r="11" fill="url(#blush)"/>

  <!-- ojos grandes brillantes -->
  <ellipse cx="76" cy="100" rx="9.5" ry="12" fill="#14532D"/>
  <ellipse cx="124" cy="100" rx="9.5" ry="12" fill="#14532D"/>
  <circle cx="79" cy="96" r="3.6" fill="#FFFFFF"/>
  <circle cx="127" cy="96" r="3.6" fill="#FFFFFF"/>
  <circle cx="73.5" cy="103" r="1.8" fill="#FFFFFF" opacity=".8"/>
  <circle cx="120.5" cy="103" r="1.8" fill="#FFFFFF" opacity=".8"/>

  <!-- cejas levantadas (amigables) -->
  <path d="M64 82 Q 76 76 88 80 M112 80 Q 124 76 136 82" stroke="#14532D" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- nariz pequeña -->
  <ellipse cx="100" cy="122" rx="6" ry="4.5" fill="#14532D"/>

  <!-- sonrisa abierta -->
  <path d="M84 132 Q 100 148 116 132 Q 100 140 84 132 Z" fill="#14532D"/>
  <path d="M92 134 Q 100 138 108 134 Q 104 140 100 140 Q 96 140 92 134 Z" fill="#F87171"/>

  <!-- bracito izquierdo -->
  <path d="M44 148 C 30 156 26 170 30 182" stroke="#166534" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="31" cy="186" r="10" fill="#22C55E" stroke="#14532D" stroke-width="2"/>
  <!-- bracito derecho saludando con mini-hoja -->
  <path d="M156 146 C 172 136 182 118 178 98" stroke="#166534" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="177" cy="92" r="11" fill="#22C55E" stroke="#14532D" stroke-width="2"/>
  <path d="M177 84 C 168 78 160 82 157 90 C 166 91 173 89 177 84 Z" fill="#4ADE80" stroke="#14532D" stroke-width="1.5"/>
</svg>
