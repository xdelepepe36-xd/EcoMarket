{% extends 'base.html' %}
{% block title %}EcoMarket - Checkout{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div style="display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;max-width:500px;margin-left:auto;margin-right:auto">
            <div style="display:flex;align-items:center;gap:8px">
                <div style="width:30px;height:30px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem"><i class="bi bi-check"></i></div>
                <span style="font-size:0.82rem;font-weight:600">Carrito</span>
            </div>
            <div style="flex:1;height:2px;background:var(--verde);margin:0 10px"></div>
            <div style="display:flex;align-items:center;gap:8px">
                <div style="width:30px;height:30px;border-radius:50%;background:var(--verde-claro);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem">2</div>
                <span style="font-size:0.82rem;font-weight:600;color:var(--verde)">Pago</span>
            </div>
            <div style="flex:1;height:2px;background:var(--verde-suave);margin:0 10px"></div>
            <div style="display:flex;align-items:center;gap:8px">
                <div style="width:30px;height:30px;border-radius:50%;background:var(--verde-suave);color:var(--texto-sec);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem">3</div>
                <span style="font-size:0.82rem;font-weight:600;color:var(--texto-sec)">Confirmación</span>
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start">
            <!-- Formulario -->
            <div style="background:var(--blanco);border-radius:24px;padding:36px;box-shadow:var(--sombra);border:1px solid rgba(46,125,50,0.08)">
                <h3 style="font-size:1rem;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(46,125,50,0.1);display:flex;align-items:center;gap:8px;color:var(--verde)">
                    <i class="bi bi-person"></i> Datos de envío
                </h3>
                <form id="checkoutForm">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
                        <div>
                            <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--texto-sec);margin-bottom:7px">Nombre</label>
                            <input type="text" id="nombre" placeholder="María" style="width:100%;padding:12px 16px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;font-family:inherit;font-size:0.9rem;outline:none">
                        </div>
                        <div>
                            <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--texto-sec);margin-bottom:7px">Apellido</label>
                            <input type="text" id="apellido" placeholder="García" style="width:100%;padding:12px 16px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;font-family:inherit;font-size:0.9rem;outline:none">
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
                        <div>
                            <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--texto-sec);margin-bottom:7px">Email</label>
                            <input type="email" id="email" placeholder="maria@email.com" style="width:100%;padding:12px 16px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;font-family:inherit;font-size:0.9rem;outline:none">
                        </div>
                        <div>
                            <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--texto-sec);margin-bottom:7px">Teléfono</label>
                            <input type="tel" placeholder="+51 999 999 999" style="width:100%;padding:12px 16px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;font-family:inherit;font-size:0.9rem;outline:none">
                        </div>
                    </div>
                    <div style="margin-bottom:16px">
                        <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--texto-sec);margin-bottom:7px">Dirección</label>
                        <input type="text" id="direccion" placeholder="Av. Los Álamos 123, Lima" style="width:100%;padding:12px 16px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;font-family:inherit;font-size:0.9rem;outline:none">
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px">
                        <div>
                            <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--texto-sec);margin-bottom:7px">Ciudad</label>
                            <input type="text" placeholder="Lima" style="width:100%;padding:12px 16px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;font-family:inherit;font-size:0.9rem;outline:none">
                        </div>
                        <div>
                            <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--texto-sec);margin-bottom:7px">Código postal</label>
                            <input type="text" placeholder="15046" style="width:100%;padding:12px 16px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;font-family:inherit;font-size:0.9rem;outline:none">
                        </div>
                    </div>

                    <h3 style="font-size:1rem;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(46,125,50,0.1);display:flex;align-items:center;gap:8px;color:var(--verde)">
                        <i class="bi bi-credit-card"></i> Método de pago
                    </h3>
                    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px">
                        <label style="display:flex;align-items:center;gap:14px;padding:14px 18px;border:1.5px solid var(--verde);border-radius:14px;background:var(--verde-suave);cursor:pointer">
                            <input type="radio" name="pago" value="card" checked style="accent-color:var(--verde);width:18px;height:18px">
                            <span style="font-size:1.3rem">💳</span>
                            <div><strong style="font-size:0.9rem">Tarjeta crédito/débito</strong><span style="display:block;font-size:0.78rem;color:var(--texto-sec)">Visa, Mastercard, Amex</span></div>
                        </label>
                        <label style="display:flex;align-items:center;gap:14px;padding:14px 18px;border:1.5px solid rgba(46,125,50,0.18);border-radius:14px;cursor:pointer">
                            <input type="radio" name="pago" value="yape" style="accent-color:var(--verde);width:18px;height:18px">
                            <span style="font-size:1.3rem">📱</span>
                            <div><strong style="font-size:0.9rem">Yape / Plin</strong><span style="display:block;font-size:0.78rem;color:var(--texto-sec)">Pago instantáneo</span></div>
                        </label>
                    </div>

                    <button type="submit" class="btn-principal" style="width:100%;padding:15px;font-size:1rem;border:none;cursor:pointer">
                        <i class="bi bi-lock-fill"></i> Pagar S/. <span id="totalPagar">0.00</span>
                    </button>
                </form>
            </div>

            <!-- Resumen -->
            <div style="background:var(--blanco);border-radius:24px;padding:28px;box-shadow:var(--sombra);border:1px solid rgba(46,125,50,0.08);position:sticky;top:88px">
                <h3 style="font-size:1rem;font-weight:700;margin-bottom:20px">🛍️ Tu pedido</h3>
                <div id="checkoutItems"></div>
                <div style="height:1px;background:rgba(46,125,50,0.08);margin:16px 0"></div>
                <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:10px;color:var(--texto-sec)"><span>Subtotal</span><span id="subtotalText">S/. 0.00</span></div>
                <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:10px;color:var(--texto-sec)"><span>Envío</span><span id="envioText" style="color:var(--verde);font-weight:700">Gratis 🎉</span></div>
                <div style="display:flex;justify-content:space-between;font-size:1.1rem;font-weight:800;padding-top:14px;border-top:2px solid rgba(46,125,50,0.1)"><span>Total</span><span id="totalText" style="color:var(--verde)">S/. 0.00</span></div>
                <div style="background:var(--verde-suave);border-radius:14px;padding:12px 14px;margin:16px 0;display:flex;gap:8px;align-items:flex-start">
                    <i class="bi bi-leaf-fill" style="color:var(--verde);margin-top:2px"></i>
                    <p style="font-size:0.78rem;color:var(--verde);line-height:1.6">Esta compra evita plástico y ahorra agua. 🌱</p>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
// Cargar carrito desde localStorage
const cart = JSON.parse(localStorage.getItem('ecomarket_cart') || '[]');
const products = JSON.parse(localStorage.getItem('EcoMarketProducts') || '[]');

function renderCheckout() {
    const container = document.getElementById('checkoutItems');
    let subtotal = 0;

    if (cart.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--texto-sec)">Tu carrito está vacío</div>';
        return;
    }

    container.innerHTML = cart.map(id => {
        const p = products.find(pr => pr.id == id) || { nombre: 'Producto', precio: 0, categoria: '' };
        subtotal += p.precio;
        return `
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
                <div style="width:44px;height:44px;border-radius:12px;background:var(--verde-suave);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">📦</div>
                <div style="flex:1">
                    <strong style="display:block;font-size:0.85rem">${p.nombre}</strong>
                    <span style="font-size:0.75rem;color:var(--texto-sec)">${p.categoria}</span>
                </div>
                <strong style="font-size:0.9rem">S/. ${p.precio.toFixed(2)}</strong>
            </div>
        `;
    }).join('');

    const envio = subtotal >= 150 ? 0 : 12;
    const total = subtotal + envio;
    document.getElementById('subtotalText').textContent = `S/. ${subtotal.toFixed(2)}`;
    document.getElementById('envioText').textContent = envio === 0 ? 'Gratis 🎉' : `S/. ${envio.toFixed(2)}`;
    document.getElementById('totalText').textContent = `S/. ${total.toFixed(2)}`;
    document.getElementById('totalPagar').textContent = total.toFixed(2);
}

document.getElementById('checkoutForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const direccion = document.getElementById('direccion').value.trim();

    if (!nombre || !email || !direccion) {
        alert('Completa todos los campos obligatorios');
        return;
    }

    const items = cart.map(id => {
        const p = products.find(pr => pr.id == id) || { nombre: 'Producto', precio: 0 };
        return { id: parseInt(id), nombre: p.nombre, precio: p.precio, cantidad: 1 };
    });

    fetch('/checkout', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ nombre, email, direccion, items })
    })
    .then(r => r.json())
    .then(d => {
        if (d.success) {
            localStorage.removeItem('ecomarket_cart');
            window.location.href = '/confirmacion?pedido_id=' + d.pedido_id;
        } else {
            alert(d.error || 'Error al procesar');
        }
    });
});

renderCheckout();
</script>
{% endblock %}
