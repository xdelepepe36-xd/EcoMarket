{% extends 'base.html' %}
{% block title %}EcoMarket - Trueques{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width:820px">
        <div class="section-title">
            <h2>🔄 Trueques EcoMarket</h2>
            <p>Cambia lo que ya no usas por algo que sí necesitas — sin dinero de por medio</p>
        </div>

        <div class="eco-tabs-mini">
            <button class="eco-tab-mini active" data-tab="recibidas">📥 Recibidas</button>
            <button class="eco-tab-mini" data-tab="enviadas">📤 Enviadas</button>
        </div>

        <div id="truequesRecibidas" class="eco-trueques-list">
            <p style="text-align:center;color:var(--texto-sec)">Cargando…</p>
        </div>
        <div id="truequesEnviadas" class="eco-trueques-list" style="display:none">
            <p style="text-align:center;color:var(--texto-sec)">Cargando…</p>
        </div>
    </div>
</section>

<style>
.eco-tabs-mini { display:flex; gap:10px; justify-content:center; margin-bottom:22px; }
.eco-tab-mini {
    border:1.5px solid rgba(46,125,50,.25); background:var(--blanco,#fff); color:var(--verde,#2e7d32);
    padding:9px 22px; border-radius:999px; font-weight:700; cursor:pointer; font-size:.9rem;
}
.eco-tab-mini.active { background:linear-gradient(135deg,#166534,#22C55E); color:#fff; border-color:transparent; }
.eco-trueques-list { display:grid; gap:14px; }
.trueque-card {
    display:flex; align-items:center; gap:16px; padding:16px 20px;
    background:var(--blanco,#fff); border:1px solid rgba(46,125,50,.14); border-radius:16px;
}
.trueque-card .t-prod { flex:1; min-width:0; }
.trueque-card .t-nombre { font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.trueque-card .t-meta { font-size:.8rem; color:var(--texto-sec,#666); }
.trueque-flecha { font-size:1.4rem; flex-shrink:0; }
.trueque-estado { font-size:.75rem; font-weight:800; padding:4px 12px; border-radius:999px; flex-shrink:0; }
.est-pendiente { background:#fff8e1; color:#b45309; }
.est-aceptado { background:#dcfce7; color:#166534; }
.est-rechazado { background:#fee2e2; color:#b91c1c; }
.trueque-msg { font-size:.82rem; color:var(--texto-sec,#666); font-style:italic; margin-top:4px; }
.trueque-btns { display:flex; gap:8px; flex-shrink:0; }
.trueque-btns button {
    border:none; border-radius:10px; padding:8px 16px; font-weight:700; cursor:pointer; font-size:.85rem;
}
.btn-ok { background:#22C55E; color:#fff; }
.btn-no { background:#fee2e2; color:#b91c1c; }
</style>

<script>
const EST_LABEL = { pendiente: '⏳ Pendiente', aceptado: '✅ Aceptado', rechazado: '❌ Rechazado' };
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function cardHTML(t, esRecibida) {
    const est = t.estado || 'pendiente';
    return `<div class="trueque-card">
        <div class="t-prod">
            <a class="t-nombre" href="/producto/${t.prod_id || t.producto_id}">${esc(t.mio_nombre || t.prod_nombre)}</a>
            <span class="t-meta">S/. ${(+ (t.mio_precio ?? t.prod_precio ?? 0)).toFixed(2)} · ${esc(t.de_quien || t.dueno || '')}</span>
            ${t.mensaje ? `<div class="trueque-msg">“${esc(t.mensaje)}”</div>` : ''}
        </div>
        <span class="trueque-flecha">⇄</span>
        <div class="t-prod">
            <a class="t-nombre" href="/producto/${t.mio_id || t.producto_mio}">${esc(t.prod_nombre || t.mio_nombre)}</a>
            <span class="t-meta">S/. ${(+ (t.prod_precio ?? t.mio_precio ?? 0)).toFixed(2)}</span>
        </div>
        <span class="trueque-estado est-${est}">${EST_LABEL[est] || est}</span>
        ${esRecibida && est === 'pendiente' ? `<div class="trueque-btns">
            <button class="btn-ok" onclick="respTrueque(${t.id},'aceptado')">Aceptar</button>
            <button class="btn-no" onclick="respTrueque(${t.id},'rechazado')">No</button>
        </div>` : ''}
    </div>`;
}

async function respTrueque(id, estado) {
    const r = await fetch(`/api/trueque/${id}/estado`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado })
    });
    const d = await r.json();
    if (d.success) cargarTrueques();
    else alert(d.error || 'Error');
}

async function cargarTrueques() {
    const r = await fetch('/api/trueques');
    const d = await r.json();
    const rc = document.getElementById('truequesRecibidas');
    const en = document.getElementById('truequesEnviadas');
    rc.innerHTML = d.recibidas.length ? d.recibidas.map(t => cardHTML(t, true)).join('')
        : '<p style="text-align:center;color:var(--texto-sec)">Nadie te ha propuesto trueques aún. ¡Comparte tus productos!</p>';
    en.innerHTML = d.enviadas.length ? d.enviadas.map(t => cardHTML(t, false)).join('')
        : '<p style="text-align:center;color:var(--texto-sec)">Aún no has propuesto trueques.</p>';
}

document.querySelectorAll('.eco-tab-mini').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.eco-tab-mini').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('truequesRecibidas').style.display = btn.dataset.tab === 'recibidas' ? '' : 'none';
        document.getElementById('truequesEnviadas').style.display = btn.dataset.tab === 'enviadas' ? '' : 'none';
    });
});
document.addEventListener('DOMContentLoaded', cargarTrueques);
</script>
{% endblock %}
