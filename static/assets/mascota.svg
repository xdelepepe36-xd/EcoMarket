<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Eco, la mascota hoja de EcoMarket">
  <defs>
    <linearGradient id="leafMain" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7BE3A8"/>
      <stop offset="0.4" stop-color="#34C759"/>
      <stop offset="0.75" stop-color="#1E9E4A"/>
      <stop offset="1" stop-color="#127A38"/>
    </linearGradient>
    <linearGradient id="leafEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6B2E" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0E6B2E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0E6B2E" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="leafShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A80" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF8A80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo ambiental -->
  <ellipse cx="100" cy="112" rx="88" ry="98" fill="#22C55E" opacity="0.08"/>
  <!-- sombra suave -->
  <ellipse cx="100" cy="206" rx="52" ry="9" fill="#0B3D1E" opacity="0.14"/>

  <!-- ===== HOJA (cuerpo) ===== -->
  <path d="M100 14
           C 141 24 169 60 174 108
           C 179 148 153 182 100 193
           C 47 182 21 148 26 108
           C 31 60 59 24 100 14 Z"
        fill="url(#leafMain)"/>
  <!-- sombreado interior para volumen -->
  <path d="M100 14 C 141 24 169 60 174 108 C 179 148 153 182 100 193 C 47 182 21 148 26 108 C 31 60 59 24 100 14 Z"
        fill="url(#leafEdge)"/>
  <!-- brillo superior -->
  <path d="M44 70 C 60 48 84 36 108 34 C 84 42 62 56 48 78 C 43 73 41 71 44 70 Z" fill="url(#leafShine)" opacity="0.85"/>
  <ellipse cx="66" cy="52" rx="9" ry="20" fill="#FFFFFF" opacity="0.35" transform="rotate(-16 66 52)"/>

  <!-- ===== NERVADURA ===== -->
  <path d="M100 44 L 100 176" stroke="#0B3D1E" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 44 L 100 176" stroke="#A7F3C9" stroke-width="2.6" stroke-linecap="round" opacity="0.9" transform="translate(-2,0)"/>
  <g stroke="#0B3D1E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.42">
    <path d="M100 66 C 81 72 63 84 51 102"/>
    <path d="M100 66 C 119 72 137 84 149 102"/>
    <path d="M100 100 C 85 105 71 116 61 132"/>
    <path d="M100 100 C 115 105 129 116 139 132"/>
    <path d="M100 132 C 89 136 79 144 71 156"/>
    <path d="M100 132 C 111 136 121 144 129 156"/>
  </g>
  <g stroke="#A7F3C9" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M100 66 C 81 72 63 84 51 102" transform="translate(-1.2,0)"/>
    <path d="M100 66 C 119 72 137 84 149 102" transform="translate(1.2,0)"/>
  </g>

  <!-- ===== BROTE en la punta ===== -->
  <path d="M100 16 C 97 8 96 4 98 -2" stroke="#166534" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M99 8 C 90 4 82 6 78 12 C 87 14 95 13 99 8 Z" fill="#4ADE80" stroke="#14532D" stroke-width="1.6"/>
  <path d="M100 6 C 104 -1 111 -3 116 0 C 112 7 105 9 100 6 Z" fill="#34C759" stroke="#14532D" stroke-width="1.6"/>

  <!-- ===== CARITA ===== -->
  <!-- cachetes -->
  <circle cx="56" cy="114" r="12" fill="url(#blush)"/>
  <circle cx="144" cy="114" r="12" fill="url(#blush)"/>

  <!-- ojos grandes con brillo triple -->
  <g>
    <ellipse cx="75" cy="102" rx="11" ry="13.5" fill="#0B3D1E"/>
    <ellipse cx="125" cy="102" rx="11" ry="13.5" fill="#0B3D1E"/>
    <circle cx="78.5" cy="97.5" r="4.4" fill="#FFFFFF"/>
    <circle cx="128.5" cy="97.5" r="4.4" fill="#FFFFFF"/>
    <circle cx="71.5" cy="106.5" r="2" fill="#FFFFFF" opacity=".85"/>
    <circle cx="121.5" cy="106.5" r="2" fill="#FFFFFF" opacity=".85"/>
    <!-- párpados felices (línea superior) -->
    <path d="M63 90 Q 75 84 87 89 M113 89 Q 125 84 137 90" stroke="#0B3D1E" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- nariz -->
  <ellipse cx="100" cy="124" rx="6.5" ry="4.8" fill="#0B3D1E"/>
  <ellipse cx="98" cy="122.5" rx="2" ry="1.4" fill="#34C759" opacity=".8"/>

  <!-- sonrisa abierta con lengua -->
  <path d="M82 133 Q 100 152 118 133 Q 100 142 82 133 Z" fill="#0B3D1E"/>
  <path d="M91 135 Q 100 139 109 135 Q 105 142 100 142 Q 95 142 91 135 Z" fill="#F87171"/>
  <path d="M88 133 Q 100 138 112 133" stroke="#4ADE80" stroke-width="2" fill="none" opacity=".5"/>

  <!-- ===== BRACITOS ===== -->
  <!-- izquierdo relajado -->
  <path d="M42 150 C 28 158 24 172 28 184" stroke="#127A38" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="29" cy="188" r="10.5" fill="#34C759" stroke="#0B3D1E" stroke-width="2.2"/>
  <!-- derecho saludando -->
  <path d="M158 148 C 174 138 184 120 180 100" stroke="#127A38" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="179" cy="93" r="12" fill="#34C759" stroke="#0B3D1E" stroke-width="2.2"/>
  <!-- mini-hoja en la mano -->
  <path d="M179 84 C 169 77 160 81 156 90 C 166 92 174 90 179 84 Z" fill="#4ADE80" stroke="#0B3D1E" stroke-width="1.6"/>
  <path d="M179 85 L 162 89" stroke="#0B3D1E" stroke-width="1.2" opacity=".5"/>

  <!-- ===== BRILLITOS alrededor ===== -->
  <g fill="#FDE68A">
    <path d="M34 60 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z" opacity=".9"/>
    <path d="M168 52 l2 4.5 4.5 2 -4.5 2 -2 4.5 -2 -4.5 -4.5 -2 4.5 -2 Z" opacity=".8"/>
    <path d="M30 130 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" opacity=".7"/>
    <circle cx="172" cy="140" r="2.4" opacity=".8"/>
    <circle cx="24" cy="100" r="2" opacity=".6"/>
  </g>
</svg>
