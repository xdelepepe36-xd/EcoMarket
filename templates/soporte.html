{% extends "base.html" %}

{% block title %}Soporte al Cliente - EcoMarket{% endblock %}

{% block content %}
<div class="container">
    <h1><span data-i18n="sup.title">Soporte al Cliente</span></h1>
    
    <div class="support-container">
        <div class="crear-ticket">
            <h2><span data-i18n="sup.create_ticket">Crear Ticket</span></h2>
            <form id="ticket-form">
                <div class="form-group">
                    <label><span data-i18n="sup.subject">Asunto</span></label>
                    <input type="text" id="ticket-asunto" required>
                </div>
                <div class="form-group">
                    <label><span data-i18n="sup.priority">Prioridad</span></label>
                    <select id="ticket-prioridad">
                        <option value="baja" data-i18n="sup.low">Baja</option>
                        <option value="media" selected data-i18n="sup.medium">Media</option>
                        <option value="alta" data-i18n="sup.high">Alta</option>
                        <option value="urgente" data-i18n="sup.urgent">Urgente</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><span data-i18n="sup.description">Descripción</span></label>
                    <textarea id="ticket-descripcion" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-principal"><span data-i18n="sup.send">Enviar Ticket</span></button>
            </form>
        </div>
        
        <div class="mis-tickets">
            <h2><span data-i18n="sup.my_tickets">Mis Tickets</span></h2>
            <div id="tickets-lista">
                <p><span data-i18n="sup.loading">Cargando tickets...</span></p>
            </div>
        </div>
    </div>
</div>

<style>
.support-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 30px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #dee2e6;
    border-radius: 5px;
}

.ticket-item {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.ticket-item.abierto {
    border-left: 4px solid #ffc107;
}

.ticket-item.resuelto {
    border-left: 4px solid #28a745;
}
</style>
{% endblock %}
